<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a33">
<title>Rounds</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f1ec;--card:#fff;--ink:#1b2a33;--muted:#6b7780;--line:#e2ded5;
  --accent:#1f7a6b;--accent-soft:#d9efe9;--busy:#c2412d;--busy-soft:#f8e1dc;
  --soon:#b7791f;--soon-soft:#f6ebd5;--a:#2f6f9f;--b:#8a4f9e;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12181c;--card:#1b2329;--ink:#e8ecee;--muted:#93a0a8;--line:#2a343b;
  --accent:#4fc2ad;--accent-soft:#17332e;--busy:#ef7a66;--busy-soft:#3a201b;
  --soon:#e0a54a;--soon-soft:#352a17;--a:#6aa9d8;--b:#c08ad2;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
@media (prefers-color-scheme:dark){header{background:#0b1013}}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header .sub{font-size:13px;opacity:.75;margin-top:2px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#5fd3bd;width:0;transition:width .3s}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0 12px;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
.days{display:flex;gap:6px;margin:4px 0 12px}
.days button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 0;font:600 14px system-ui}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days button.today{box-shadow:inset 0 -3px 0 var(--accent)}
.days button.on.today{box-shadow:none}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between}
h2 span{text-transform:none;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.item:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.item .txt{flex:1;min-width:0}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font:600 11px system-ui;padding:2px 7px;border-radius:999px;margin-top:3px}
.tag.busy{background:var(--busy-soft);color:var(--busy)}
.tag.soon{background:var(--soon-soft);color:var(--soon)}
.tag.free{background:var(--accent-soft);color:var(--accent)}
.phase{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line);font:700 14px system-ui}
.card>.phase:first-child{border-top:0}
.phase small{font-weight:600;color:var(--muted)}
.phase.complete{color:var(--accent)}
.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:8px 10px}
.chip b{display:block;font-size:14px}
.chip small{font-size:12px;color:var(--muted)}
.chip.busy{border-left-color:var(--busy)}
.chip.busy small{color:var(--busy)}
.chip.soon{border-left-color:var(--soon)}
.chip.soon small{color:var(--soon)}
.empty{padding:16px;color:var(--muted);text-align:center}
.room{padding:12px 14px;border-top:1px solid var(--line)}
.room:first-child{border-top:0}
.room .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room .blk{font:700 11px system-ui;padding:2px 7px;border-radius:6px;color:#fff}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slot{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.slot button{border:0;background:none;color:var(--busy);font-size:16px;line-height:1;padding:0 2px}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
input,select{font:15px system-ui;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
input[type=time]{width:110px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px system-ui;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--busy)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.erow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .txt{flex:1;min-width:0;font-size:14px}
.erow .txt small{display:block;color:var(--muted);font-size:12px}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:16px;flex:none}
.form{padding:12px;display:grid;gap:8px}
.note{font-size:13px;color:var(--muted);margin:8px 2px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:600 14px system-ui;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.done-banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:14px;text-align:center;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1 id="title">Today</h1>
  <div class="sub" id="sub"></div>
  <div class="bar"><i id="prog"></i></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Checklist</button>
  <button data-tab="rooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Rooms</button>
  <button data-tab="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Edit</button>
</nav>

<script>
"use strict";
const DAYS=["Mon","Tue","Wed","Thu","Fri"];
const KEY="rounds-v1";

/* ---------- starting data ---------- */
const ROOMS=[
  ["h1","H1","A"],["h2","H2","A"],["h3","H3","A"],["h4","H4","A"],
  ["ao1","Deputy Head office","A"],["ao2","Exams office","A"],["ao3","Cover office","A"],["ao4","Lead Head of Year office","A"],
  ["gt","Girls toilets","A"],["ast","A Staff toilet","A"],["acor","A corridor","A"],
  ["s1","S1","B"],["s2","S2","B"],["bus","Business ICT","B"],
  ["bt","Boys toilets","B"],["bst","B Staff toilet","B"],
  ["p1","Pastoral 1","B"],["p2","Pastoral 2","B"],["p3","Pastoral 3","B"],
  ["th","Therapy room","B"],["tho1","Therapy office (daily)","B"],["tho2","Therapy office 2","B"],["tho3","Therapy office 3","B"],
  ["l1","Landing 1 (S1/Business)","B"],["l2","Landing 2 (Pastoral/S2)","B"]
].map(([id,name,block])=>({id,name,block}));
const TIMETABLED=["h1","h2","h3","h4","s1","s2","bus","th","tho1","tho2","tho3","p1","p2","p3","ao1","ao2","ao3","ao4"];

let _n=0;const nid=()=>Date.now().toString(36)+(_n++).toString(36);
const D=(phase,text,room)=>({id:nid(),phase,text,room:room||""});
const W=(day,text,room)=>({id:nid(),day,text,room:room||""});

function seed(){
  const daily=[];
  const P1="1 · Empty classroom bins";
  ["h1","h2","h3","h4","s1","s2","bus"].forEach(r=>daily.push(D(P1,roomName(r)+" bin",r)));
  const P2="2 · Corridor bins";
  [1,2,3].forEach(i=>daily.push(D(P2,"Corridor bin "+i,"")));
  const P2b="3 · Wipe tables";
  ["h1","h2","h3","h4","s1","s2","bus"].forEach(r=>daily.push(D(P2b,"Wipe "+roomName(r)+" tables",r)));
  const P3="4 · Chairs on tables";
  ["h1","h2","h3","h4","s1","s2","bus"].forEach(r=>daily.push(D(P3,roomName(r)+" chairs up",r)));
  const P4="5 · Vacuum A block";
  daily.push(D(P4,"Vacuum H1","h1"),D(P4,"Vacuum H3","h3"),D(P4,"Vacuum H4","h4"),
             D(P4,"Vacuum H2, out into the corridor","h2"),
             D(P4,"Vacuum Deputy Head office","ao1"),D(P4,"Vacuum Exams office","ao2"),D(P4,"Vacuum Cover office","ao3"),D(P4,"Vacuum Lead Head of Year office","ao4"));
  const P5="6 · Business room power run";
  daily.push(D(P5,"Vacuum Business ICT","bus"),D(P5,"Vacuum Landing 1","l1"),D(P5,"Vacuum rest of A block corridor","acor"));
  const P6="7 · Therapy room";
  daily.push(D(P6,"Vacuum therapy room","th"),D(P6,"Vacuum daily-use therapy office","tho1"));
  const P7="8 · Sweep science";
  daily.push(D(P7,"Sweep S1","s1"),D(P7,"Sweep S2","s2"));
  const P8="9 · Pastoral & final landing";
  daily.push(D(P8,"Vacuum Pastoral 1","p1"),D(P8,"Vacuum Pastoral 2","p2"),D(P8,"Vacuum Pastoral 3","p3"),D(P8,"Vacuum Landing 2","l2"));
  const P9="10 · Toilets";
  ["gt","ast","bt","bst"].forEach(r=>daily.push(D(P9,"Clean "+roomName(r),r)));
  ["gt","ast","bt","bst"].forEach(r=>daily.push(D(P9,"Mop "+roomName(r),r)));

  const weekly=[
    W(0,"Windows – A block"),W(0,"Dust window sills – A block"),
    W(1,"Windows – B block"),W(1,"Dust window sills – B block"),
    W(2,"Door glass & handles – both blocks"),W(2,"Spot-clean walls & switches"),
    W(3,"Skirting boards & radiators"),W(3,"Vacuum therapy offices 2 & 3","tho2"),
    W(4,"Descale toilets, sinks & urinals"),W(4,"Mirrors, dispensers & bin liners stock check")
  ];
  return {v:4,daily,weekly,rooms:ROOMS,timetable:baseTimetable(),ticks:{week:"",days:{}},wdone:{week:"",ids:[]}};
}
function baseTimetable(){
  const t={s2:{},h2:{1:[{s:"15:00",e:"16:00",n:"Chess club"}]}};
  for(let d=0;d<5;d++)t.s2[d]=[{s:"15:00",e:"17:00",n:"Detention"}];
  return t;
}
function roomName(id){const r=((S&&S.rooms)||[]).find(x=>x.id===id)||ROOMS.find(x=>x.id===id);return r?r.name:id}

/* ---------- storage ---------- */
let S=null;
function load(){try{const t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load()||seed();
if(!S.v||S.v<2){
  const labels={"4 · Vacuum A block":"5 · Vacuum A block","5 · Business room power run":"6 · Business room power run","6 · Therapy room":"7 · Therapy room","7 · Sweep science":"8 · Sweep science","8 · Pastoral & final landing":"9 · Pastoral & final landing","9 · Toilets":"10 · Toilets","3 · Chairs on tables":"4 · Chairs on tables"};
  S.daily.forEach(d=>{if(labels[d.phase])d.phase=labels[d.phase]});
  if(!S.daily.some(d=>/^Wipe .* tables$/.test(d.text))){
    let at=S.daily.findIndex(d=>d.phase==="4 · Chairs on tables");if(at<0)at=S.daily.length;
    S.daily.splice(at,0,...["h1","h2","h3","h4","s1","s2","bus"].map(r=>D("3 · Wipe tables","Wipe "+roomName(r)+" tables",r)));
  }
  S.weekly=S.weekly.filter(w=>!/^Wipe desks & tables/.test(w.text));
  S.ticks={week:"",days:{}};delete S.done;S.v=2;
}
if(S.v<3){
  const names={ao1:"Deputy Head office",ao2:"Exams office",ao3:"Cover office"};
  S.rooms.forEach(r=>{if(names[r.id])r.name=names[r.id]});
  if(!S.rooms.some(r=>r.id==="ao4")){const i=S.rooms.findIndex(r=>r.id==="ao3");S.rooms.splice(i<0?S.rooms.length:i+1,0,{id:"ao4",name:"Lead Head of Year office",block:"A"})}
  S.daily.forEach(d=>{const m=/^Vacuum A Office ([123])$/.exec(d.text);if(m)d.text="Vacuum "+names["ao"+m[1]]});
  if(!S.daily.some(d=>d.room==="ao4")){
    const i=S.daily.findIndex(d=>d.room==="ao3");const ph=i<0?"5 · Vacuum A block":S.daily[i].phase;
    S.daily.splice(i<0?S.daily.length:i+1,0,D(ph,"Vacuum Lead Head of Year office","ao4"));
  }
  if(!S.weekly.some(w=>/^Windows/.test(w.text)))S.weekly.unshift(W(0,"Windows – A block"),W(1,"Windows – B block"));
  S.v=3;
}
if(S.v<4){
  const b=baseTimetable();S.timetable=S.timetable||{};
  for(const r in b)for(const d in b[r]){
    S.timetable[r]=S.timetable[r]||{};const list=S.timetable[r][d]=S.timetable[r][d]||[];
    b[r][d].forEach(x=>{if(!list.some(y=>y.s===x.s&&y.n===x.n))list.push(x)});
  }
  S.v=4;
}
save();

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function weekKey(d){const x=new Date(d);const g=x.getDay();if(g===6)x.setDate(x.getDate()+2);else if(g===0)x.setDate(x.getDate()+1);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return ymd(x)}
function todayIdx(){const g=new Date().getDay();return g>=1&&g<=5?g-1:-1}
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};

function rollover(){
  const d=new Date();
  if(S.ticks.week!==weekKey(d)){S.ticks={week:weekKey(d),days:{}}}
  if(S.wdone.week!==weekKey(d)){S.wdone={week:weekKey(d),ids:[]}}
  save();
}

/* ---------- room status ---------- */
function slots(room,day){return ((S.timetable[room]||{})[day]||[]).slice().sort((a,b)=>a.s.localeCompare(b.s))}
function status(room,day){
  if(!room)return null;
  const list=slots(room,day);if(!list.length)return null;
  if(day!==todayIdx())return {k:"info",t:list.map(x=>x.s+"–"+x.e).join(", ")};
  const n=nowMin();
  for(const x of list){
    if(toMin(x.s)<=n&&n<toMin(x.e))return {k:"busy",t:"In use till "+x.e+(x.n?" · "+x.n:"")};
  }
  const next=list.find(x=>toMin(x.s)>n);
  if(next){const gap=toMin(next.s)-n;return {k:gap<=30?"soon":"free",t:(gap<=30?"Needed in "+gap+" min":"Free till "+next.s)}}
  return {k:"free",t:"Free rest of day"};
}

/* ---------- UI ---------- */
let tab="today",view=Math.max(todayIdx(),0),editMode="daily";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function header(title,sub,pct){
  $("#title").textContent=title;$("#sub").textContent=sub;
  $("#prog").style.width=(pct==null?0:pct)+"%";
  $("#prog").parentElement.style.display=pct==null?"none":"block";
}
function dayTabs(){
  return '<div class="days">'+DAYS.map((d,i)=>`<button data-day="${i}" class="${i===view?"on":""} ${i===todayIdx()?"today":""}">${d}</button>`).join("")+"</div>";
}

function renderToday(){
  rollover();
  const isToday=view===todayIdx();
  const doneSet=new Set(S.ticks.days[view]||[]);
  const wSet=new Set(S.wdone.ids);
  const weekly=S.weekly.filter(w=>w.day===view);
  const total=S.daily.length+weekly.length;
  const done=S.daily.filter(x=>doneSet.has(x.id)).length+weekly.filter(x=>wSet.has(x.id)).length;
  const pct=total?Math.round(done/total*100):0;
  const dname=["Monday","Tuesday","Wednesday","Thursday","Friday"][view];
  header(isToday?"Today":dname, `${isToday?dname+" · ":""}${done}/${total} done`, pct);

  let h=dayTabs();

  // live board
  const busyRooms=TIMETABLED.map(r=>({r,st:status(r,view)})).filter(x=>x.st);
  if(isToday&&busyRooms.length){
    h+='<h2>Rooms right now</h2><div class="status">'+
      busyRooms.sort((a,b)=>({busy:0,soon:1,free:2}[a.st.k]-({busy:0,soon:1,free:2}[b.st.k]))).map(x=>`<div class="chip ${x.st.k}"><b>${esc(roomName(x.r))}</b><small>${esc(x.st.t)}</small></div>`).join("")+"</div>";
  }

  // daily grouped by phase
  h+='<h2>Daily round</h2><div class="card">';
  let cur=null;
  const groups=[];S.daily.forEach(it=>{if(!cur||cur.p!==it.phase){cur={p:it.phase,items:[]};groups.push(cur)}cur.items.push(it)});
  groups.forEach(g=>{
    const gd=g.items.filter(i=>doneSet.has(i.id)).length;
    h+=`<div class="phase ${gd===g.items.length?"complete":""}">${esc(g.p)}<small>${gd}/${g.items.length}</small></div>`;
    g.items.forEach(it=>h+=itemHTML(it,doneSet.has(it.id),"d"));
  });
  h+="</div>";

  h+=`<h2>${dname}'s weekly jobs</h2><div class="card">`;
  h+=weekly.length?weekly.map(it=>itemHTML(it,wSet.has(it.id),"w")).join(""):'<div class="empty">No weekly jobs set for this day</div>';
  h+="</div>";

  if(total&&done===total)h+='<div class="done-banner">All done – nothing missed 👊</div>';
  $("#main").innerHTML=h;
}
function itemHTML(it,done,kind){
  const st=status(it.room,view);
  const tag=st&&!done?`<div><span class="tag ${st.k==="info"?"free":st.k}">${esc(st.t)}</span></div>`:"";
  return `<div class="item ${done?"done":""}" data-tick="${kind}:${it.id}"><div class="box"></div><div class="txt">${esc(it.text)}${tag}</div></div>`;
}

function renderRooms(){
  header("Rooms","When each room is in use – tap × to remove",null);
  let h=dayTabs()+'<p class="note">Add the times a room is booked on this day. The checklist flags rooms that are in use or needed soon.</p>';
  ["A","B"].forEach(b=>{
    h+=`<h2>${b} block</h2><div class="card">`;
    S.rooms.filter(r=>r.block===b&&TIMETABLED.includes(r.id)).forEach(r=>{
      const st=status(r.id,view);
      h+=`<div class="room"><div class="top"><b>${esc(r.name)}</b>${st&&st.k!=="info"?`<span class="tag ${st.k}">${esc(st.t)}</span>`:""}</div>
      <div class="slots">${slots(r.id,view).map((x,i)=>`<span class="slot">${x.s}–${x.e}${x.n?" · "+esc(x.n):""}<button data-delslot="${r.id}:${i}" aria-label="Remove">×</button></span>`).join("")||'<span class="note" style="margin:0">Not booked</span>'}</div>
      <div class="add"><input type="time" id="s-${r.id}" value="15:30"><input type="time" id="e-${r.id}" value="16:30"><input id="n-${r.id}" placeholder="note" style="flex:1;min-width:70px"><button class="btn" data-addslot="${r.id}">Add</button></div>
      <div class="add"><button class="btn ghost" data-copyslot="${r.id}" style="padding:6px 10px;font-size:12px">Copy this day to all weekdays</button></div></div>`;
    });
    h+="</div>";
  });
  $("#main").innerHTML=h;
}

function renderEdit(){
  header("Edit","Change jobs, order and rooms",null);
  const roomOpts=sel=>'<option value="">No room</option>'+S.rooms.map(r=>`<option value="${r.id}" ${r.id===sel?"selected":""}>${esc(r.name)}</option>`).join("");
  let h=`<div class="seg"><button data-mode="daily" class="${editMode==="daily"?"on":""}">Daily jobs</button><button data-mode="weekly" class="${editMode==="weekly"?"on":""}">Weekly jobs</button><button data-mode="backup" class="${editMode==="backup"?"on":""}">Backup</button></div>`;
  if(editMode==="daily"){
    const phases=[...new Set(S.daily.map(d=>d.phase))];
    h+=`<div class="card"><div class="form">
      <input id="nd-text" placeholder="New job, e.g. Wipe staff room sink">
      <select id="nd-phase">${phases.map(p=>`<option>${esc(p)}</option>`).join("")}<option value="__new">+ New section…</option></select>
      <select id="nd-room">${roomOpts("")}</select>
      <button class="btn" id="nd-add">Add daily job</button></div></div>
      <p class="note">Use ↑ ↓ to match the order you actually work in.</p><div class="card">`;
    S.daily.forEach((d,i)=>h+=`<div class="erow"><div class="txt">${esc(d.text)}<small>${esc(d.phase)}${d.room?" · "+esc(roomName(d.room)):""}</small></div>
      <button class="ic" data-mv="daily:${i}:-1">↑</button><button class="ic" data-mv="daily:${i}:1">↓</button><button class="ic" data-del="daily:${d.id}">🗑</button></div>`);
    h+="</div>";
  }else if(editMode==="weekly"){
    h+=`<div class="card"><div class="form">
      <input id="nw-text" placeholder="New weekly job, e.g. Clean skirting in H1–H4">
      <select id="nw-day">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select>
      <select id="nw-room">${roomOpts("")}</select>
      <button class="btn" id="nw-add">Add weekly job</button></div></div>
      <p class="note">These are starter jobs – swap them for your real weekly list. Change the day to spread the load.</p>`;
    DAYS.forEach((dn,di)=>{
      h+=`<h2>${dn}</h2><div class="card">`;
      const list=S.weekly.filter(w=>w.day===di);
      h+=list.length?list.map(w=>`<div class="erow"><div class="txt">${esc(w.text)}${w.room?`<small>${esc(roomName(w.room))}</small>`:""}</div>
        <select data-wday="${w.id}" style="width:74px">${DAYS.map((d,i)=>`<option value="${i}" ${i===di?"selected":""}>${d}</option>`).join("")}</select>
        <button class="ic" data-del="weekly:${w.id}">🗑</button></div>`).join(""):'<div class="empty">Nothing on '+dn+'</div>';
      h+="</div>";
    });
  }else{
    h+=`<div class="card"><div class="form">
      <p class="note" style="margin:0">Everything is stored on this phone only. Save a backup file to Google Drive or email it to yourself so you don't lose your timetable.</p>
      <button class="btn" id="exp">Save backup file</button>
      <label class="btn ghost" style="text-align:center">Restore from backup<input type="file" id="imp" accept="application/json" hidden></label>
      <button class="btn danger" id="reset">Reset to starting list</button></div></div>`;
  }
  $("#main").innerHTML=h;
}

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  ({today:renderToday,rooms:renderRooms,edit:renderEdit})[tab]();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-tick]");if(!t)return;
  const ds=t.dataset;
  if(ds.tab){tab=ds.tab;window.scrollTo(0,0);render();return}
  if(ds.day){view=+ds.day;render();return}
  if(ds.mode){editMode=ds.mode;render();return}
  if(ds.tick){
    const[k,id]=ds.tick.split(":");
    const arr=k==="d"?(S.ticks.days[view]=S.ticks.days[view]||[]):S.wdone.ids;
    const i=arr.indexOf(id);i>=0?arr.splice(i,1):arr.push(id);
    if(navigator.vibrate)navigator.vibrate(12);
    save();render();return;
  }
  if(ds.addslot){
    const r=ds.addslot,s=$("#s-"+r).value,en=$("#e-"+r).value,n=$("#n-"+r).value.trim();
    if(!s||!en||en<=s){alert("End time needs to be after start time");return}
    S.timetable[r]=S.timetable[r]||{};(S.timetable[r][view]=S.timetable[r][view]||[]).push({s,e:en,n});
    save();render();return;
  }
  if(ds.delslot){
    const[r,i]=ds.delslot.split(":");const list=slots(r,view);list.splice(+i,1);S.timetable[r][view]=list;save();render();return;
  }
  if(ds.copyslot){
    const r=ds.copyslot;const src=slots(r,view);
    if(!confirm("Copy "+DAYS[view]+"'s times for "+roomName(r)+" to every weekday?"))return;
    S.timetable[r]={};DAYS.forEach((_,i)=>S.timetable[r][i]=src.map(x=>({...x})));save();render();return;
  }
  if(ds.mv){
    const[,i,dir]=ds.mv.split(":");const a=S.daily,x=+i,y=x+ +dir;
    if(y<0||y>=a.length)return;[a[x],a[y]]=[a[y],a[x]];save();render();return;
  }
  if(ds.del){
    const[k,id]=ds.del.split(":");
    if(!confirm("Delete this job?"))return;
    S[k]=S[k].filter(x=>x.id!==id);save();render();return;
  }
  if(t.id==="nd-add"){
    const text=$("#nd-text").value.trim();if(!text)return;
    let phase=$("#nd-phase").value;
    if(phase==="__new"){phase=(prompt("Name of new section")||"").trim();if(!phase)return}
    const room=$("#nd-room").value;
    let at=-1;S.daily.forEach((d,i)=>{if(d.phase===phase)at=i});
    const it=D(phase,text,room);at<0?S.daily.push(it):S.daily.splice(at+1,0,it);
    save();render();return;
  }
  if(t.id==="nw-add"){
    const text=$("#nw-text").value.trim();if(!text)return;
    S.weekly.push(W(+$("#nw-day").value,text,$("#nw-room").value));save();render();return;
  }
  if(t.id==="exp"){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rounds-backup-"+ymd(new Date())+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);return;
  }
  if(t.id==="reset"){
    if(confirm("Reset all jobs and timetables back to the starting list?")){S=seed();save();render()}return;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.wday){const w=S.weekly.find(x=>x.id===t.dataset.wday);if(w){w.day=+t.value;save();render()}}
  if(t.id==="imp"&&t.files[0]){
    t.files[0].text().then(txt=>{
      try{const d=JSON.parse(txt);if(!d.daily||!d.weekly)throw 0;S=d;save();alert("Backup restored");render()}
      catch(err){alert("That file isn't a Rounds backup")}
    });
  }
});

// keep "now" statuses fresh
setInterval(()=>{if(tab==="today"||tab==="rooms"){const y=scrollY;render();scrollTo(0,y)}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js");
render();
</script>
</body>
</html>
